# Runs type checks and unit tests on every pull request and push.
# It does not block the deploy; it tells you early when something breaks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        continue-on-error: true # shows type errors without failing the run
      - run: npm run test:unit
